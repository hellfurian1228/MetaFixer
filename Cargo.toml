[package]
name = "metafixer"
version = "1.0.0"
edition = "2021"
description = "Meta Fixer — Rift and Quest PC Link control panel"
license = "MIT"
default-run = "metafixer"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
wait-timeout = "0.2"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
